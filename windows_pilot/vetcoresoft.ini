; VetCoreSoft Desktop Configuration — Pilot
; This file tells VetCoreSoft where the cloud API is for license checks.

[cloud]
; Cloud API base URL (nginx reverse proxy on the LAN server)
api_url = http://api.vetcoresoft.app

; Cloud API admin secret (must match the server's API_SECRET env var)
api_secret = vetcoresoft-dev-secret-change-in-prod
