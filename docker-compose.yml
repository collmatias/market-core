services:
  # --- BASE DE DATOS (Para modo SAAS) ---
  db:
    image: postgres:15-alpine
    container_name: marketcore_db_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=marketcore_db
      - POSTGRES_USER=marketcore_user
      - POSTGRES_PASSWORD=marketcore_pass
    ports:
      - "5432:5432"
    restart: always

  # --- BACKEND 1: MODO DESKTOP (SQLite) ---
  # Acceso: http://localhost:8000
  api_desktop:
    build: ./backend
    container_name: marketcore_desktop
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DEPLOYMENT_MODE=DESKTOP
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only-key-change-in-production}
      - ALLOWED_HOSTS=*
      - LICENSE_API_URL=http://cloud_api:8000/check-license
      - AM_I_IN_DOCKER=1
      - MARKETCORE_MODE=DEV
    ports:
      - "8000:8000"
    depends_on:
      - cloud_api

  # --- BACKEND 2: MODO SAAS (Postgres) ---
  # Acceso: http://localhost:8001
  api_saas:
    build: ./backend
    container_name: marketcore_saas
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DEPLOYMENT_MODE=SAAS
      - POSTGRES_DB=marketcore_db
      - POSTGRES_USER=marketcore_user
      - POSTGRES_PASSWORD=marketcore_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only-key-change-in-production}
      - ALLOWED_HOSTS=*
      - DEBUG=1
      - LICENSE_API_URL=http://cloud_api:8000/check-license
      - AM_I_IN_DOCKER=1
      - MARKETCORE_MODE=DEV
    ports:
      - "8001:8000"
    depends_on:
      - db

  # --- 1. BASE DE DATOS DE LA NUBE (LICENCIAS) ---
  cloud_db:
    image: postgres:15
    environment:
      - POSTGRES_DB=licenses_db
      - POSTGRES_USER=cloud_admin
      - POSTGRES_PASSWORD=cloud_secret_pass
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # --- 2. API DE LA NUBE (GESTIÓN CENTRAL) ---
  cloud_api:
    build: ./cloud_api
    container_name: cloud_api_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./cloud_api:/app
    ports:
      - "5000:8000"
    environment:
      - DATABASE_URL=postgresql://cloud_admin:cloud_secret_pass@cloud_db/licenses_db
      - API_SECRET=${API_SECRET:-marketcore-dev-secret-change-in-prod}
      - JWT_SECRET=${JWT_SECRET:-marketcore-jwt-dev-secret-change-in-prod}
      - DEBUG=1
      - CORS_ORIGINS=*
      - RATE_LIMIT_DEFAULT=120/minute
    depends_on:
      - cloud_db

volumes:
  cloud_postgres_data: 
  postgres_data:
