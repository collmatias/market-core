services:
  # --- BASE DE DATOS (Para modo SAAS) ---
  db:
    image: postgres:15-alpine
    container_name: vetcoresoft_db_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=vetcore_db
      - POSTGRES_USER=vetcore_user
      - POSTGRES_PASSWORD=vetcore_pass
    ports:
      - "5432:5432"
    restart: always

  # --- BACKEND: MODO SAAS (Postgres) ---
  # Acceso LAN: http://<IP>:8001  o  http://vetcoresoft.app (via nginx)
  api_saas:
    build: ./backend
    container_name: vetcoresoft_saas
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DEPLOYMENT_MODE=SAAS
      - POSTGRES_DB=vetcore_db
      - POSTGRES_USER=vetcore_user
      - POSTGRES_PASSWORD=vetcore_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only-key-change-in-production}
      - ALLOWED_HOSTS=*,vetcoresoft.app,api.vetcoresoft.app
      - DEBUG=1
      - LICENSE_API_URL=http://cloud_api:8000/check-license
      - CLOUD_API_URL=http://cloud_api:8000
      - CLOUD_API_SECRET=${API_SECRET:-vetcoresoft-dev-secret-change-in-prod}
      - AM_I_IN_DOCKER=1
      - VETCORE_MODE=DEV
      # Email (Gmail SMTP)
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=vetcoresoft@gmail.com
      - EMAIL_HOST_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=VetCoreSoft <vetcoresoft@gmail.com>
    ports:
      - "8001:8000"
    depends_on:
      - db

  # --- 1. BASE DE DATOS DE LA NUBE (LICENCIAS) ---
  cloud_db:
    image: postgres:15
    environment:
      - POSTGRES_DB=licenses_db
      - POSTGRES_USER=cloud_admin
      - POSTGRES_PASSWORD=cloud_secret_pass
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # --- 2. API DE LA NUBE (GESTIÓN CENTRAL) ---
  cloud_api:
    build: ./cloud_api
    container_name: cloud_api_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./cloud_api:/app
    ports:
      - "5000:8000"
    environment:
      - DATABASE_URL=postgresql://cloud_admin:cloud_secret_pass@cloud_db/licenses_db
      - API_SECRET=${API_SECRET:-vetcoresoft-dev-secret-change-in-prod}
      - JWT_SECRET=${JWT_SECRET:-vetcoresoft-jwt-dev-secret-change-in-prod}
      - DEBUG=1
      - CORS_ORIGINS=*,http://vetcoresoft.app,http://api.vetcoresoft.app,http://localhost:8000,http://localhost:8001
      - RATE_LIMIT_DEFAULT=120/minute
    depends_on:
      - cloud_db

  # --- 3. NGINX REVERSE PROXY ---
  # Maps api.vetcoresoft.app → cloud_api, vetcoresoft.app → api_saas (port 80)
  nginx:
    image: nginx:alpine
    container_name: vetcoresoft_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - cloud_api
      - api_saas

volumes:
  cloud_postgres_data: 
  postgres_data:
