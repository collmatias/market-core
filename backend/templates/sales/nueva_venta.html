{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-7">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-search"></i> Buscar Productos</h5>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="buscador" class="form-control form-control-lg" placeholder="Escribe nombre o código..." list="lista-productos" autocomplete="off">
                    <button class="btn btn-outline-primary" type="button" onclick="agregarProducto()">Agregar</button>
                </div>
                
                <datalist id="lista-productos">
                    {% for p in productos %}
                    <option value="{{ p.descripcion }} | ${{ p.precio_venta }}" data-id="{{ p.id }}" data-precio="{{ p.precio_venta }}"></option>
                    {% endfor %}
                </datalist>

                <div class="alert alert-info small mt-3">
                    <i class="bi bi-info-circle"></i> Escriba el nombre del producto y presione Enter para agregarlo al ticket.
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card shadow border-success h-100">
            <div class="card-header bg-success text-white d-flex justify-content-between">
                <h5 class="mb-0"><i class="bi bi-cart"></i> Venta Actual</h5>
                <h5 class="mb-0 fw-bold" id="total-display">$0.00</h5>
            </div>
            <div class="card-body d-flex flex-column">
                
                <form method="post" id="form-venta">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Cliente</label>
                        <select name="cliente" class="form-select">
                            <option value="">-- Cliente Anónimo / Mostrador --</option>
                            {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.apellido }}, {{ c.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Método de Pago</label>
                        <select name="metodo_pago" class="form-select">
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                            <option value="QR">QR / Billetera</option>
                        </select>
                    </div>

                    <input type="hidden" name="carrito_data" id="carrito-data">

                    <div class="table-responsive flex-grow-1 border rounded mb-3" style="max-height: 300px; overflow-y: auto;">
                        <table class="table table-sm table-striped mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th>Producto</th>
                                    <th style="width: 70px;">Cant.</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tabla-carrito">
                                </tbody>
                        </table>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg" onclick="prepararEnvio(event)">
                            <i class="bi bi-currency-dollar"></i> Cobrar y Finalizar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    let carrito = []; // Aquí guardamos los objetos {id, nombre, precio, cantidad}

    // Detectar Enter en el buscador
    document.getElementById('buscador').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // Evitar submit del form
            agregarProducto();
        }
    });

    function agregarProducto() {
        const input = document.getElementById('buscador');
        const valor = input.value;
        const datalist = document.getElementById('lista-productos');
        
        // Buscar el producto en el datalist para sacar su ID y Precio
        let opcionSeleccionada = null;
        for (let i = 0; i < datalist.options.length; i++) {
            if (datalist.options[i].value === valor) {
                opcionSeleccionada = datalist.options[i];
                break;
            }
        }

        if (opcionSeleccionada) {
            const id = opcionSeleccionada.getAttribute('data-id');
            const precio = parseFloat(opcionSeleccionada.getAttribute('data-precio').replace(',', '.')); // Asegurar formato decimal
            const nombre = valor.split(' | ')[0]; // Limpiar nombre

            // Verificar si ya existe para sumar cantidad
            const existente = carrito.find(item => item.id === id);
            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({ id, nombre, precio, cantidad: 1 });
            }

            renderizarCarrito();
            input.value = ''; // Limpiar buscador
            input.focus();
        } else {
            alert("Producto no encontrado. Seleccione uno de la lista.");
        }
    }

    function renderizarCarrito() {
        const tbody = document.getElementById('tabla-carrito');
        const totalDisplay = document.getElementById('total-display');
        tbody.innerHTML = '';
        let total = 0;

        carrito.forEach((item, index) => {
            const subtotal = item.cantidad * item.precio;
            total += subtotal;

            const row = `
                <tr>
                    <td><small>${item.nombre}</small></td>
                    <td>
                        <input type="number" class="form-control form-control-sm p-1" 
                               value="${item.cantidad}" min="1" 
                               onchange="actualizarCantidad(${index}, this.value)">
                    </td>
                    <td>$${subtotal.toFixed(2)}</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-link text-danger p-0" 
                                onclick="eliminarItem(${index})"><i class="bi bi-x-circle"></i></button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        totalDisplay.innerText = `$${total.toFixed(2)}`;
    }

    function actualizarCantidad(index, nuevaCantidad) {
        if (nuevaCantidad < 1) return;
        carrito[index].cantidad = parseInt(nuevaCantidad);
        renderizarCarrito();
    }

    function eliminarItem(index) {
        carrito.splice(index, 1);
        renderizarCarrito();
    }

    function prepararEnvio(event) {
        if (carrito.length === 0) {
            event.preventDefault();
            alert("El carrito está vacío.");
            return;
        }
        // Guardar el array JSON en el input oculto antes de enviar
        document.getElementById('carrito-data').value = JSON.stringify(carrito);
    }
</script>
{% endblock %}
