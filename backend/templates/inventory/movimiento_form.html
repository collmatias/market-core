{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-warning">
            <div class="card-header bg-warning text-dark"><h4><i class="bi bi-arrow-left-right"></i> Movimiento de Stock</h4></div>
            <div class="card-body">
                <div class="alert alert-info small">
                    <i class="bi bi-info-circle"></i> Use esto para cargar facturas de compra o ajustes manuales. Las ventas se descontarán solas desde la caja.
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }} <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-dark">Registrar Movimiento</button>
                        <a href="{% url 'lista_productos' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
