{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h3 class="mb-4"><i class="bi bi-plus-circle"></i> {% trans "Add Product" %}</h3>
        <form method="post">
            {% csrf_token %}
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">{% trans "Description" %} *</label>
                            <input type="text" name="description" class="form-control" required maxlength="300">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans "SKU" %}</label>
                            <input type="text" name="sku" class="form-control" maxlength="50">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans "Barcode" %} (EAN)</label>
                            <input type="text" name="ean" class="form-control" maxlength="50">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans "Brand" %}</label>
                            <input type="text" name="brand" class="form-control" maxlength="150">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans "Category" %}</label>
                            <input type="text" name="category" class="form-control" maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{% trans "Unit Price" %} *</label>
                            <input type="number" name="unit_price" class="form-control" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{% trans "Available Stock" %}</label>
                            <input type="number" name="stock_available" class="form-control" min="0" value="0">
                        </div>
                    </div>
                </div>
                <div class="card-footer text-end">
                    <a href="{% url 'supplier_dashboard' %}" class="btn btn-outline-secondary me-2">{% trans "Cancel" %}</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {% trans "Add Product" %}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
