{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Email Sent" %} — VetCoreSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .reset-card {
            width: 100%; max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25);
            border: none; overflow: hidden;
        }
        .reset-header {
            background: #0a1628; color: #fff;
            padding: 2rem; text-align: center;
        }
    </style>
</head>
<body>
<div class="reset-card">
    <div class="reset-header">
        <div style="font-size:2.5rem">📧</div>
        <h4 class="fw-bold mb-1">{% trans "Check your email" %}</h4>
    </div>
    <div class="card-body p-4 bg-white text-center">
        <p class="text-muted">
            {% trans "If an account exists with that email, we've sent a password reset link. Please check your inbox and spam folder." %}
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">
            <i class="bi bi-arrow-left me-1"></i>{% trans "Back to Sign In" %}
        </a>
    </div>
</div>
</body>
</html>
