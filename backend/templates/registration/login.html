{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Login" %} - VetCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card-login { 
            width: 100%; 
            max-width: 400px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            border: none;
        }
        .login-header {
            background-color: white;
            padding: 30px 20px 10px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }
        .logo-icon { font-size: 3.5rem; }
    </style>
</head>
<body>

    <div class="card card-login">
        <div class="login-header">
            <div class="logo-icon">🐶</div>
            <h2 class="fw-bold text-primary mb-0">VetCore</h2>
            <p class="text-muted small">{% trans "Veterinary Management System" %}</p>
        </div>
        
        <div class="card-body p-4 bg-white">
            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger py-2 small text-center mb-3">
                    {% trans "Invalid username or password." %}
                </div>
                {% endif %}

                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="floatingInput" placeholder="{% trans 'Username' %}" required autofocus>
                    <label for="floatingInput">{% trans "Username" %}</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="{% trans 'Password' %}" required>
                    <label for="floatingPassword">{% trans "Password" %}</label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">{% trans "SIGN IN" %}</button>
                </div>
            </form>
        </div>
        <div class="card-footer text-center bg-light py-3 small text-muted border-0 rounded-bottom">
            &copy; 2026 VetCore Systems
        </div>
    </div>

</body>
</html>
